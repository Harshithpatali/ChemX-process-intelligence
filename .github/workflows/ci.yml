name: ChemX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-api.txt pytest httpx

      - name: Syntax check
        run: python -m compileall -q src scripts

      - name: Unit and API smoke tests
        env:
          PYTHONPATH: .
          CHEMX_ENV: test
          CHEMX_ALLOW_RUNTIME_TRAINING: "false"
          CHEMX_CORS_ORIGINS: http://localhost:8501
        run: pytest tests/ -v --tb=short

      - name: Model artifact check
        env:
          PYTHONPATH: .
          CHEMX_ENV: test
        run: python -c "from src.utils.model_registry import load_bundle; b,m=load_bundle(); assert 'pls' in b and 'bayes' in b and 'monitor' in b; print(m)"

      - name: Dependency consistency
        run: python -m pip check
