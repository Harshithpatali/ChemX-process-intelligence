name: ChemX CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chemx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Syntax check
        run: python -m compileall -q src scripts tests

      - name: Ruff static checks
        run: ruff check src scripts tests --select E,F --ignore E501

      - name: Unit and API smoke tests
        env:
          PYTHONPATH: .
          CHEMX_ENV: test
          CHEMX_ALLOW_RUNTIME_TRAINING: "false"
          CHEMX_CORS_ORIGINS: http://localhost:8501
        run: pytest tests/ -v --tb=short

      - name: Model artifact check
        env:
          PYTHONPATH: .
          CHEMX_ENV: test
        run: python -c "from src.utils.model_registry import load_bundle; b,m=load_bundle(); assert 'pls' in b and 'bayes' in b and 'monitor' in b; print(m)"

      - name: Dependency consistency
        run: python -m pip check

      - name: Build production Docker image
        run: docker build --tag chemx-api:ci .
