name: ChemX CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Unit tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short
      - name: Import check
        run: |
          PYTHONPATH=. python -c "from src.utils.io import load_mlnir; print(load_mlnir()['n_samples'])"
